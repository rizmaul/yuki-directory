<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Twin falling stars</title>
<style>
  body { margin: 0; }
  .scene { display: grid; width: min(100%, 360px); aspect-ratio: 2 / 3; margin-inline: auto; }
  canvas { grid-area: 1 / 1; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
<div class="scene" role="img" aria-label="Two seated twins in a field beneath twin falling stars">
  <canvas id="sky" width="60" height="90"></canvas>
  <canvas id="field" width="60" height="90"></canvas>
  <canvas id="twins" width="60" height="90"></canvas>
  <canvas id="meteors" width="60" height="90"></canvas>
  <canvas id="grass" width="60" height="90"></canvas>
</div>
<script>
  const layer = id => document.getElementById(id).getContext('2d')

  function pixel(ctx, color, x, y, width = 1, height = 1) {
    ctx.fillStyle = color
    ctx.fillRect(x, y, width, height)
  }

  function cross(ctx, x, y) {
    pixel(ctx, '#aaa', x - 1, y, 3)
    pixel(ctx, '#aaa', x, y - 1, 1, 3)
    pixel(ctx, '#fff', x, y)
  }

  const sky = layer('sky')
  pixel(sky, '#141414', 0, 0, 60, 90)
  for (const [x, y] of [[4, 6], [13, 11], [24, 6], [35, 12], [51, 8], [56, 15], [8, 23],
    [19, 19], [45, 25], [53, 30], [13, 36], [30, 38], [42, 42], [56, 43], [5, 47], [23, 48]]) {
    pixel(sky, '#777', x, y)
  }
  cross(sky, 13, 29)
  cross(sky, 48, 16)

  const field = layer('field')
  for (let x = 0; x < 60; x++) {
    const hill = 59 - Math.round(5 * Math.cos((x - 46) / 15))
    const meadow = 69 - Math.round(5 * Math.cos((x - 24) / 17))
    pixel(field, '#373737', x, hill, 1, 90 - hill)
    pixel(field, '#242424', x, meadow, 1, 90 - meadow)
  }

  const twins = layer('twins')
  const colors = { '#': '#0b0b0b', '+': '#707070', '*': '#adadad' }
  function sprite(rows, x, y) {
    rows.forEach((row, dy) => [...row].forEach((cell, dx) => {
      if (colors[cell]) pixel(twins, colors[cell], x + dx, y + dy)
    }))
  }
  sprite([
    '....+++......', '..++####.....', '..#######....', '..#######....',
    '...#####.....', '....###......', '...+++++.....', '..++####+....',
    '..+######.##.', '.+#######.###', '.+############',
    '.#############', '##############', '#############.',
  ], 15, 55)
  sprite([
    '....+++........', '...+####.......', '..+######......', '..#######......',
    '...######......', '....#####+.....', '...***+##+.....', '..+**++##+.....',
    '..+*+++##+.##..', '.+*+++##+..###.', '.++++####.####.',
    '.++++##########', '.##############', '##############.',
  ], 30, 55)

  const meteors = layer('meteors')
  for (const [x, y] of [[24, 29], [33, 33]]) {
    for (let i = 1; i < 14; i++) {
      pixel(meteors, i < 6 ? '#bbb' : '#555', x + i, y - Math.round(i * 0.7))
    }
    cross(meteors, x, y)
  }

  const grass = layer('grass')
  pixel(grass, '#101010', 0, 79, 60, 11)
  for (const [x, y] of [[2, 79], [7, 83], [12, 77], [20, 83], [26, 80],
    [35, 84], [43, 78], [49, 82], [55, 77], [58, 84]]) {
    pixel(grass, '#555', x, y - 2, 1, 3)
    pixel(grass, '#555', x - 1, y - 3)
  }
</script>
</html>
